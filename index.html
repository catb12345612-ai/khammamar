<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Furniture Visualizer</title>
    
    <!-- Load Tailwind CSS for modern, clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f3f4f6; /* Tailwind gray-100 */
            font-family: 'Inter', sans-serif;
        }

        /* The 3D Canvas */
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* Dimension Hotspots (Hidden by default) */
        .dimension-hotspot {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e7eb;
            border-radius: 9999px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #1f2937;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }
        
        .dimension-hotspot.show {
            opacity: 1;
        }

        /* Custom AR Button slot inside model-viewer */
        .ar-button {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #111827; /* gray-900 */
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ar-button:hover {
            background-color: #374151;
        }

        /* Hide AR button on devices that don't support it */
        model-viewer:not([ar-status="session-started"]) .ar-button {
            display: flex;
        }
        model-viewer[ar-status="session-started"] .ar-button {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="relative w-full h-full">
        
        <!-- 3D Viewer Element -->
        <!-- Starts without a src; user must upload -->
        <model-viewer 
            id="furniture-viewer" 
            alt="A 3D model of furniture"
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            auto-rotate
            shadow-intensity="1.5"
            exposure="1">
            
            <!-- AR Button -->
            <button slot="ar-button" class="ar-button">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm2 1v1h1V5H5zm0 8a1 1 0 00-1 1v3a1 1 0 001 1h3a1 1 0 001-1v-3a1 1 0 00-1-1H5zm1 1v1h1v-1H6zm6-9a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1V4zm2 1v1h1V5h-1zm-2 9a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-3zm2 1v1h1v-1h-1z" clip-rule="evenodd" />
                </svg>
                View in your room
            </button>

            <!-- Dimension Hotspots (Default positions, usually adjusted per model) -->
            <button slot="hotspot-width" class="dimension-hotspot" data-position="0.5 0.5 0" data-normal="1 0 0">
                Width: ~200cm
            </button>
            <button slot="hotspot-height" class="dimension-hotspot" data-position="0 1.0 0" data-normal="0 1 0">
                Height: ~85cm
            </button>
            <button slot="hotspot-depth" class="dimension-hotspot" data-position="-0.5 0.5 0.5" data-normal="0 0 1">
                Depth: ~90cm
            </button>
        </model-viewer>

        <!-- Initial Upload Overlay (Disappears after upload) -->
        <div id="upload-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-100/90 backdrop-blur-sm z-20 transition-opacity duration-500">
            <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm w-full mx-4">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Upload Furniture</h2>
                <p class="text-gray-500 mb-6 text-sm">Select a .glb 3D model from your device to visualize.</p>
                
                <label for="file-upload" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-colors inline-block w-full">
                    Choose .glb File
                </label>
                <input id="file-upload" type="file" accept=".glb" class="hidden" onchange="handleFileUpload(event)">
            </div>
        </div>

        <!-- Floating UI Panel (Top Right) -->
        <div class="absolute top-4 right-4 bg-white/80 backdrop-blur-md p-4 rounded-xl shadow-lg border border-white/20 z-10 w-64">
            
            <!-- Upload New File Button (Small) -->
            <div class="mb-4 pb-4 border-b border-gray-200">
                <label for="file-upload-small" class="cursor-pointer flex items-center justify-center gap-2 text-sm text-blue-600 font-semibold hover:text-blue-800 transition-colors w-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    Load New Model
                </label>
                <input id="file-upload-small" type="file" accept=".glb" class="hidden" onchange="handleFileUpload(event)">
            </div>

            <!-- Color Customization -->
            <div class="mb-4">
                <p class="text-sm font-bold text-gray-700 mb-2">Fabric Color</p>
                <div class="flex gap-3">
                    <!-- Slate Gray: #2F4F4F -> RGB(0.18, 0.31, 0.31) -->
                    <button class="w-8 h-8 rounded-full border-2 border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-gray-400 transition-transform hover:scale-110" 
                            style="background-color: #2F4F4F;" 
                            data-color="0.18,0.31,0.31,1" 
                            onclick="changeColor(this)"
                            title="Slate Gray"></button>
                    
                    <!-- Dark Red: #8B0000 -> RGB(0.54, 0.0, 0.0) -->
                    <button class="w-8 h-8 rounded-full border-2 border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-red-400 transition-transform hover:scale-110" 
                            style="background-color: #8B0000;" 
                            data-color="0.54,0.0,0.0,1" 
                            onclick="changeColor(this)"
                            title="Crimson"></button>
                    
                    <!-- Tan/Beige: #D2B48C -> RGB(0.82, 0.70, 0.55) -->
                    <button class="w-8 h-8 rounded-full border-2 border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-yellow-400 transition-transform hover:scale-110" 
                            style="background-color: #D2B48C;" 
                            data-color="0.82,0.70,0.55,1" 
                            onclick="changeColor(this)"
                            title="Beige"></button>
                </div>
            </div>

            <!-- Toggle Dimensions -->
            <div>
                <button id="toggle-dims-btn" onclick="toggleDimensions()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg text-sm transition-colors border border-gray-300">
                    Show Dimensions
                </button>
            </div>
        </div>

        <!-- Custom Toast Notification (Replaces alert()) -->
        <div id="toast-message" class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2 font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
            </svg>
            <span id="toast-text">Message goes here</span>
        </div>

    </div>

    <script>
        const viewer = document.getElementById('furniture-viewer');
        const uploadOverlay = document.getElementById('upload-overlay');
        const toast = document.getElementById('toast-message');
        const toastText = document.getElementById('toast-text');
        let currentBlobUrl = null;

        /**
         * Handle file upload from the local file system
         * Creates a temporary blob URL to display the .glb file safely in the browser.
         */
        function handleFileUpload(event) {
            const file = event.target.files[0];
            
            if (!file) return;

            // Validate file type
            if (!file.name.toLowerCase().endsWith('.glb')) {
                showToast("Please upload a valid .glb file.");
                return;
            }

            // Cleanup previous object URL to prevent memory leaks
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
            }

            // Create a new URL for the uploaded file
            currentBlobUrl = URL.createObjectURL(file);
            
            // Set it to the model viewer
            viewer.src = currentBlobUrl;

            // Hide the initial upload overlay if it's visible
            if (!uploadOverlay.classList.contains('hidden')) {
                uploadOverlay.style.opacity = '0';
                setTimeout(() => {
                    uploadOverlay.classList.add('hidden');
                }, 500);
            }

            showToast("Model loaded successfully!");
            
            // Reset the file input so the user can upload the same file again if needed
            event.target.value = '';
        }

        /**
         * Change the color of the 3D model's primary material.
         */
        function changeColor(element) {
            if (!viewer.model) {
                showToast("Please wait for the model to finish loading.");
                return;
            }
            
            // Extract the color array from the data attribute (e.g., "0.18,0.31,0.31,1")
            const colorString = element.getAttribute("data-color");
            const colorArray = colorString.split(',').map(Number);
            
            // Attempt to apply color to the first material
            try {
                const material = viewer.model.materials[0];
                if (material) {
                    material.pbrMetallicRoughness.setBaseColorFactor(colorArray);
                } else {
                    showToast("No material found on this model to change.");
                }
            } catch (error) {
                console.error("Error changing color:", error);
                showToast("This model's materials cannot be modified.");
            }
        }

        /**
         * Toggle the visibility of the dimension hotspots.
         */
        function toggleDimensions() {
            const tags = document.querySelectorAll('.dimension-hotspot');
            const btn = document.getElementById('toggle-dims-btn');
            
            let isShowing = false;
            
            tags.forEach(tag => {
                if (tag.classList.contains('show')) {
                    tag.classList.remove('show');
                    isShowing = false;
                } else {
                    tag.classList.add('show');
                    isShowing = true;
                }
            });
            
            if (isShowing) {
                btn.innerText = "Hide Dimensions";
                btn.classList.replace('bg-gray-100', 'bg-blue-100');
                btn.classList.replace('text-gray-700', 'text-blue-800');
            } else {
                btn.innerText = "Show Dimensions";
                btn.classList.replace('bg-blue-100', 'bg-gray-100');
                btn.classList.replace('text-blue-800', 'text-gray-700');
            }
        }

        /**
         * Custom Toast Notification Function (Replaces standard alerts)
         */
        let toastTimeout;
        function showToast(message) {
            toastText.innerText = message;
            
            // Show toast
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            // Clear existing timeout if it's already showing
            clearTimeout(toastTimeout);
            
            // Hide toast after 3 seconds
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
