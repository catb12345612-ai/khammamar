<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syed Zeeshaan Ali AR - Premium</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #050505; }
        
        #scene-container {
            width: 100vw; height: 100vh;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-color: #111; transition: background-image 0.5s ease-in-out;
        }

        model-viewer {
            width: 100%; height: 100%; background-color: transparent;
            --poster-color: transparent; touch-action: none; outline: none;
        }

        /* Sleek Glassmorphism */
        .glass-panel {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }

        /* AR Dimension Tags */
        .dim-tag {
            background: rgba(255, 255, 255, 0.95);
            color: #000; font-size: 12px; font-weight: 700;
            padding: 6px 12px; border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ddd;
            display: none; /* Hidden by default */
            pointer-events: none;
        }
        .dim-tag.visible { display: block; }
    </style>
</head>
<body>

    <div id="scene-container">
        <!-- 3D Viewer Element -->
        <model-viewer 
            id="sofa-viewer" 
            src="sofa.glb.glb" 
            camera-controls 
            auto-rotate
            shadow-intensity="2"
            shadow-softness="1"
            exposure="1">
            
            <!-- Dimension Hotspots (Rough generic positions) -->
            <button slot="hotspot-width" class="dim-tag" data-position="0 0.5 0.5" data-normal="0 0 1">Width: 210cm</button>
            <button slot="hotspot-height" class="dim-tag" data-position="0 1 0" data-normal="0 1 0">Height: 85cm</button>
            <button slot="hotspot-depth" class="dim-tag" data-position="1 0.5 0" data-normal="1 0 0">Depth: 95cm</button>
        </model-viewer>
    </div>

    <!-- Premium UI Sidebar -->
    <div class="glass-panel absolute top-6 left-6 p-6 rounded-2xl z-10 w-[360px] max-h-[90vh] overflow-y-auto flex flex-col gap-6">
        
        <h1 class="text-2xl font-bold text-white tracking-wide">Syed Zeeshaan Ali <span class="text-blue-500">AR</span></h1>

        <!-- 1. Background Upload -->
        <div>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">1. Room Photo</h2>
            <label for="room-upload" class="cursor-pointer flex items-center justify-center gap-2 w-full bg-white/5 hover:bg-white/10 border border-white/10 text-white text-sm py-3 px-4 rounded-xl transition-all">
                Upload Background
            </label>
            <input id="room-upload" type="file" accept="image/*" class="hidden" onchange="handleRoomUpload(event)">
        </div>

        <!-- 2. Furniture Selection (Horizontal Scroll) -->
        <div>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">2. Select Furniture</h2>
            <div class="flex gap-3 overflow-x-auto pb-2">
                <!-- Change the names in the single quotes to match your GitHub files -->
                <button onclick="switchModel('sofa.glb.glb')" class="whitespace-nowrap bg-blue-600 hover:bg-blue-500 text-white text-sm py-2 px-4 rounded-lg font-medium transition-all shadow-lg">Green Sofa</button>
                <button onclick="switchModel('sofa2.glb')" class="whitespace-nowrap bg-white/10 hover:bg-white/20 text-white text-sm py-2 px-4 rounded-lg font-medium transition-all">Modern L-Shape</button>
                <button onclick="switchModel('chair.glb')" class="whitespace-nowrap bg-white/10 hover:bg-white/20 text-white text-sm py-2 px-4 rounded-lg font-medium transition-all">Accent Chair</button>
            </div>
        </div>

        <!-- 3. Feature Controls (Lock & Dimensions) -->
        <div>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">3. Controls</h2>
            <div class="flex gap-3">
                <button id="lock-btn" onclick="toggleLock()" class="flex-1 bg-white/10 hover:bg-white/20 border border-white/10 text-white text-sm py-2 px-3 rounded-lg transition-all flex items-center justify-center gap-2">
                    <span id="lock-icon">🔓</span> <span id="lock-text">Lock Position</span>
                </button>
                <button id="dim-btn" onclick="toggleDimensions()" class="flex-1 bg-white/10 hover:bg-white/20 border border-white/10 text-white text-sm py-2 px-3 rounded-lg transition-all">
                    📏 Show Specs
                </button>
            </div>
        </div>

        <!-- 4. Fabric Color Palette -->
        <div>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">4. Fabric Color</h2>
            <div class="grid grid-cols-6 gap-2.5">
                <!-- Greyscale & Neutrals -->
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #ffffff;" data-color="1,1,1,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #e4e4e7;" data-color="0.8,0.8,0.8,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #a1a1aa;" data-color="0.4,0.4,0.4,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #52525b;" data-color="0.1,0.1,0.1,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #27272a;" data-color="0.02,0.02,0.02,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #09090b;" data-color="0.001,0.001,0.001,1" onclick="changeColor(this)"></button>

                <!-- Browns, Tans & Leathers -->
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #f5f5dc;" data-color="0.9,0.9,0.7,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #d2b48c;" data-color="0.65,0.45,0.25,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #d97706;" data-color="0.6,0.25,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #8b4513;" data-color="0.25,0.06,0.01,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #5c4033;" data-color="0.1,0.05,0.03,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #4a0404;" data-color="0.06,0.001,0.001,1" onclick="changeColor(this)"></button>

                <!-- Reds & Pinks -->
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #fbcfe8;" data-color="0.95,0.6,0.8,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #ec4899;" data-color="0.8,0.06,0.3,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #e11d48;" data-color="0.7,0.01,0.06,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #ef4444;" data-color="0.8,0.05,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #dc2626;" data-color="0.6,0.02,0.02,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #7f1d1d;" data-color="0.2,0.01,0.01,1" onclick="changeColor(this)"></button>

                <!-- Oranges & Yellows -->
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #ffdab9;" data-color="1.0,0.7,0.5,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #f97316;" data-color="0.9,0.15,0.01,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #c2410c;" data-color="0.5,0.05,0.005,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #fef08a;" data-color="0.95,0.85,0.2,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #eab308;" data-color="0.8,0.45,0.01,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #65a30d;" data-color="0.12,0.35,0.005,1" onclick="changeColor(this)"></button>

                <!-- Greens -->
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #a7f3d0;" data-color="0.35,0.85,0.6,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #4ade80;" data-color="0.06,0.7,0.2,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #10b981;" data-color="0.005,0.5,0.2,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #15803d;" data-color="0.005,0.2,0.03,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #064e3b;" data-color="0.001,0.07,0.03,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #0d9488;" data-color="0.002,0.25,0.2,1" onclick="changeColor(this)"></button>

                <!-- Blues & Purples -->
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #bae6fd;" data-color="0.45,0.75,0.95,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #3b82f6;" data-color="0.04,0.2,0.8,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #1d4ed8;" data-color="0.01,0.05,0.4,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #1e3a8a;" data-color="0.01,0.03,0.2,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #d8b4fe;" data-color="0.65,0.4,0.95,1" onclick="changeColor(this)"></button>
                <button class="w-9 h-9 rounded-full border border-white/20 hover:scale-110 transition-transform" style="background: #6b21a8;" data-color="0.15,0.01,0.35,1" onclick="changeColor(this)"></button>
            </div>
        </div>
    </div>

    <!-- Instructions Overlay -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 glass-panel text-gray-300 px-6 py-2 rounded-full text-xs font-medium pointer-events-none z-10">
        Drag to spin &bull; Scroll to scale &bull; Right-click to move
    </div>

    <script>
        const viewer = document.getElementById('sofa-viewer');
        const sceneContainer = document.getElementById('scene-container');
        let isLocked = false;
        let dimsVisible = false;

        // Background Image Upload
        function handleRoomUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                sceneContainer.style.backgroundImage = `url('${e.target.result}')`;
            };
            reader.readAsDataURL(file);
        }

        // Switch 3D Model
        function switchModel(filename) {
            viewer.src = filename;
        }

        // Change Material Color safely
        function changeColor(element) {
            if (!viewer.model) return;
            const colorArray = element.getAttribute("data-color").split(',').map(Number);
            try {
                viewer.model.materials.forEach(material => {
                    if (material && material.pbrMetallicRoughness) {
                        material.pbrMetallicRoughness.setBaseColorFactor(colorArray);
                    }
                });
            } catch (error) {
                console.error("Error updating model color:", error);
            }
        }

        // Lock Position (Disables Pan and Zoom, keeps Rotate)
        function toggleLock() {
            const btn = document.getElementById('lock-btn');
            const icon = document.getElementById('lock-icon');
            const text = document.getElementById('lock-text');
            
            isLocked = !isLocked;
            
            if (isLocked) {
                viewer.setAttribute('disable-zoom', 'true');
                viewer.setAttribute('disable-pan', 'true');
                btn.classList.add('bg-red-500/20', 'border-red-500/50', 'text-red-400');
                btn.classList.remove('bg-white/10', 'border-white/10', 'text-white');
                icon.innerText = "🔒";
                text.innerText = "Locked";
            } else {
                viewer.removeAttribute('disable-zoom');
                viewer.removeAttribute('disable-pan');
                btn.classList.remove('bg-red-500/20', 'border-red-500/50', 'text-red-400');
                btn.classList.add('bg-white/10', 'border-white/10', 'text-white');
                icon.innerText = "🔓";
                text.innerText = "Lock Position";
            }
        }

        // Toggle Dimensions visibility
        function toggleDimensions() {
            const tags = document.querySelectorAll('.dim-tag');
            const btn = document.getElementById('dim-btn');
            
            dimsVisible = !dimsVisible;
            
            tags.forEach(tag => {
                if (dimsVisible) {
                    tag.classList.add('visible');
                } else {
                    tag.classList.remove('visible');
                }
            });
            
            if (dimsVisible) {
                btn.classList.add('bg-blue-500/20', 'border-blue-500/50', 'text-blue-400');
                btn.classList.remove('bg-white/10', 'border-white/10', 'text-white');
            } else {
                btn.classList.remove('bg-blue-500/20', 'border-blue-500/50', 'text-blue-400');
                btn.classList.add('bg-white/10', 'border-white/10', 'text-white');
            }
        }
    </script>
</body>
</html>
