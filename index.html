<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Photo Furniture Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
        #scene-container { width: 100vw; height: 100vh; background-size: cover; background-position: center; transition: background-image 0.5s ease-in-out; }
        model-viewer { width: 100%; height: 100%; background-color: transparent; touch-action: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>

    <div id="scene-container">
        <!-- The 3D Viewer defaults to loading sofa1.glb first -->
        <model-viewer id="furniture-viewer" src="sofa1.glb" camera-controls auto-rotate shadow-intensity="2"></model-viewer>
    </div>

    <div class="glass-panel absolute top-6 left-6 p-6 rounded-2xl z-10 w-[340px] max-h-[90vh] overflow-y-auto">
        <h1 class="text-2xl font-bold text-white mb-6">High-Fledged <span class="text-blue-400">AR</span></h1>

        <!-- Step 1: Upload Room Photo -->
        <div class="mb-8">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">1. Background</h2>
            <label for="room-upload" class="cursor-pointer flex items-center justify-center gap-2 w-full bg-white/10 hover:bg-white/20 border border-white/10 text-white text-sm font-medium py-3 px-4 rounded-xl transition-all">
                Upload Room Photo
            </label>
            <input id="room-upload" type="file" accept="image/*" class="hidden" onchange="handleRoomUpload(event)">
        </div>

        <!-- Step 2: Choose Furniture Model -->
        <div class="mb-8">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">2. Choose Furniture</h2>
            <div class="flex flex-col gap-2">
                <!-- Ensure the filenames in single quotes exactly match what you uploaded to GitHub -->
                <button class="bg-white/10 text-white text-sm py-2 px-3 rounded-lg text-left hover:bg-blue-500/50" onclick="switchModel('sofa1.glb')">Standard Sofa</button>
                <button class="bg-white/10 text-white text-sm py-2 px-3 rounded-lg text-left hover:bg-blue-500/50" onclick="switchModel('sofa2.glb')">Premium L-Shape</button>
                <button class="bg-white/10 text-white text-sm py-2 px-3 rounded-lg text-left hover:bg-blue-500/50" onclick="switchModel('chair1.glb')">Accent Chair</button>
            </div>
        </div>

        <!-- Step 3: Color Palette -->
        <div class="mb-6">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">3. Fabric Color</h2>
            <div class="grid grid-cols-6 gap-3">
                <button class="w-8 h-8 rounded-full border border-white/20" style="background-color: #d4d4d8;" data-color="0.7,0.7,0.7,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20" style="background-color: #18181b;" data-color="0.05,0.05,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20" style="background-color: #d97706;" data-color="0.6,0.25,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20" style="background-color: #14532d;" data-color="0.02,0.15,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20" style="background-color: #1e3a8a;" data-color="0.02,0.05,0.3,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20" style="background-color: #7f1d1d;" data-color="0.2,0.01,0.01,1" onclick="changeColor(this)"></button>
            </div>
        </div>
    </div>

    <script>
        const viewer = document.getElementById('furniture-viewer');
        const sceneContainer = document.getElementById('scene-container');

        function handleRoomUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { sceneContainer.style.backgroundImage = `url('${e.target.result}')`; };
            reader.readAsDataURL(file);
        }

        // This function changes the 3D model source file
        function switchModel(filename) {
            viewer.src = filename;
        }

        function changeColor(element) {
            if (!viewer.model) return;
            const colorArray = element.getAttribute("data-color").split(',').map(Number);
            try {
                viewer.model.materials.forEach(material => {
                    if (material && material.pbrMetallicRoughness) {
                        material.pbrMetallicRoughness.setBaseColorFactor(colorArray);
                    }
                });
            } catch (error) {
                console.error("Color change failed:", error);
            }
        }
    </script>
</body>
</html>
