<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Updated Browser Tab Title -->
    <title>Syed Zeeshaan Ali AR</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; 
        }

        #scene-container {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1e293b;
            transition: background-image 0.5s ease-in-out;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
            --poster-color: transparent;
            touch-action: none;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div id="scene-container">
        
        <!-- Updated to look for EXACTLY sofa.glb -->
        <model-viewer 
            id="sofa-viewer" 
            src="sofa.glb" 
            camera-controls 
            auto-rotate
            shadow-intensity="2"
            shadow-softness="1"
            exposure="1">
        </model-viewer>

    </div>

    <div class="glass-panel absolute top-6 left-6 p-6 rounded-2xl z-10 w-[340px] max-h-[90vh] overflow-y-auto">
        
        <!-- Updated Personal Branding -->
        <h1 class="text-2xl font-bold text-white mb-6 tracking-wide">Syed Zeeshaan Ali <span class="text-blue-400">AR</span></h1>

        <!-- Step 1: Upload Room Photo -->
        <div class="mb-8">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">1. Background</h2>
            <label for="room-upload" class="cursor-pointer flex items-center justify-center gap-2 w-full bg-white/10 hover:bg-white/20 border border-white/10 text-white text-sm font-medium py-3 px-4 rounded-xl transition-all duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                Upload Room Photo
            </label>
            <input id="room-upload" type="file" accept="image/*" class="hidden" onchange="handleRoomUpload(event)">
        </div>

        <!-- Step 2: 24-Color Palette -->
        <div class="mb-6">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">2. Fabric Color</h2>
            
            <div class="grid grid-cols-6 gap-3">
                <!-- Neutrals & Greys -->
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #ffffff;" data-color="0.95,0.95,0.95,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #d4d4d8;" data-color="0.7,0.7,0.7,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #71717a;" data-color="0.3,0.3,0.3,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #18181b;" data-color="0.05,0.05,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #f3e8ff;" data-color="0.9,0.85,0.9,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #fef08a;" data-color="0.9,0.8,0.2,1" onclick="changeColor(this)"></button>
                
                <!-- Earth & Browns -->
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #fde68a;" data-color="0.85,0.75,0.6,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #d97706;" data-color="0.6,0.25,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #92400e;" data-color="0.3,0.1,0.02,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #451a03;" data-color="0.1,0.02,0.01,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #f97316;" data-color="0.9,0.3,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #eab308;" data-color="0.8,0.6,0.05,1" onclick="changeColor(this)"></button>

                <!-- Greens & Blues -->
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #86efac;" data-color="0.4,0.8,0.5,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #22c55e;" data-color="0.05,0.5,0.1,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #14532d;" data-color="0.02,0.15,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #bae6fd;" data-color="0.4,0.7,0.9,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #3b82f6;" data-color="0.05,0.2,0.8,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #1e3a8a;" data-color="0.02,0.05,0.3,1" onclick="changeColor(this)"></button>

                <!-- Reds & Purples -->
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #fca5a5;" data-color="0.9,0.3,0.3,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #ef4444;" data-color="0.8,0.05,0.05,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #7f1d1d;" data-color="0.2,0.01,0.01,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #f472b6;" data-color="0.9,0.2,0.5,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #a855f7;" data-color="0.4,0.1,0.7,1" onclick="changeColor(this)"></button>
                <button class="w-8 h-8 rounded-full border border-white/20 shadow-inner focus:outline-none focus:ring-2 focus:ring-white transition-transform hover:scale-110" style="background-color: #4c1d95;" data-color="0.1,0.02,0.3,1" onclick="changeColor(this)"></button>
            </div>
        </div>
    </div>

    <!-- Elegant Helper Text Overlay -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 glass-panel text-white/90 px-8 py-3 rounded-full text-sm font-medium tracking-wide pointer-events-none z-10 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-75" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
        </svg>
        Drag to rotate &bull; Scroll to scale &bull; Right-click (or 2-finger drag) to move
    </div>

    <script>
        const viewer = document.getElementById('sofa-viewer');
        const sceneContainer = document.getElementById('scene-container');

        function handleRoomUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                sceneContainer.style.backgroundImage = `url('${e.target.result}')`;
            };
            reader.readAsDataURL(file);
        }

        function changeColor(element) {
            if (!viewer.model) {
                console.warn("Model is not loaded yet.");
                return;
            }
            
            const colorString = element.getAttribute("data-color");
            const colorArray = colorString.split(',').map(Number);
            
            try {
                viewer.model.materials.forEach(material => {
                    if (material && material.pbrMetallicRoughness) {
                        material.pbrMetallicRoughness.setBaseColorFactor(colorArray);
                    }
                });
            } catch (error) {
                console.error("Error updating model color:", error);
            }
        }
    </script>
</body>
</html>
