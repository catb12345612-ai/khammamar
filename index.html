<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Photo Furniture Visualizer</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
        }

        /* Container that holds the uploaded background image */
        #scene-container {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f3f4f6; /* Default light background before upload */
            transition: background-image 0.3s ease;
        }

        /* The 3D Canvas - Must have a transparent background to see the room photo behind it */
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
            --poster-color: transparent;
        }

        /* Custom Scrollbar for UI */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Main Scene Container (Background image goes here) -->
    <div id="scene-container">
        
        <!-- 3D Viewer Element -->
        <model-viewer 
            id="sofa-viewer" 
            src="sofa.glb" 
            camera-controls 
            auto-rotate
            shadow-intensity="1.5"
            exposure="1">
        </model-viewer>

    </div>

    <!-- UI Panel (Left Side - Controls) -->
    <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-md p-5 rounded-xl shadow-2xl border border-gray-200 z-10 w-80">
        
        <h1 class="text-xl font-bold text-gray-800 mb-4">Visualizer Studio</h1>

        <!-- Step 1: Upload Room Photo -->
        <div class="mb-6">
            <h2 class="text-sm font-bold text-gray-700 mb-2">1. Upload Room Photo</h2>
            <label for="room-upload" class="cursor-pointer flex items-center justify-center gap-2 w-full bg-gray-800 hover:bg-gray-900 text-white text-sm font-semibold py-2 px-4 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" />
                </svg>
                Take/Upload Picture
            </label>
            <input id="room-upload" type="file" accept="image/*" class="hidden" onchange="handleRoomUpload(event)">
        </div>

        <!-- Step 2: Change Colors -->
        <div class="mb-6">
            <h2 class="text-sm font-bold text-gray-700 mb-2">2. Change Sofa Color</h2>
            <div class="flex gap-3">
                <!-- Red Color -->
                <button class="w-10 h-10 rounded-full border-2 border-white shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-transform hover:scale-110" 
                        style="background-color: #991b1b;" 
                        data-color="0.5,0.02,0.02,1" 
                        onclick="changeColor(this)"
                        title="Ruby Red"></button>
                
                <!-- Green Color -->
                <button class="w-10 h-10 rounded-full border-2 border-white shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-transform hover:scale-110" 
                        style="background-color: #166534;" 
                        data-color="0.05,0.3,0.1,1" 
                        onclick="changeColor(this)"
                        title="Emerald Green"></button>
                
                <!-- Beige/Tan Color -->
                <button class="w-10 h-10 rounded-full border-2 border-white shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-600 transition-transform hover:scale-110" 
                        style="background-color: #d4d4d8;" 
                        data-color="0.8,0.8,0.8,1" 
                        onclick="changeColor(this)"
                        title="Light Grey"></button>
            </div>
        </div>

        <!-- Optional: Upload different 3D Model -->
        <div class="pt-4 border-t border-gray-200">
            <p class="text-xs text-gray-500 mb-2">Testing a different 3D file?</p>
            <label for="model-upload" class="cursor-pointer text-xs text-blue-600 font-semibold hover:text-blue-800">
                + Upload new .glb file
            </label>
            <input id="model-upload" type="file" accept=".glb" class="hidden" onchange="handleModelUpload(event)">
        </div>
    </div>

    <!-- Instructions Overlay (Disappears after room upload) -->
    <div id="instruction-overlay" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 bg-black/70 text-white px-6 py-3 rounded-full backdrop-blur-sm pointer-events-none transition-opacity duration-500">
        Upload a photo of your room to get started!
    </div>

    <script>
        const viewer = document.getElementById('sofa-viewer');
        const sceneContainer = document.getElementById('scene-container');
        const instructionOverlay = document.getElementById('instruction-overlay');
        let currentModelUrl = null;

        /**
         * Reads the uploaded image file and sets it as the background
         */
        function handleRoomUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Use FileReader to convert the image file into a Data URL
            const reader = new FileReader();
            
            reader.onload = function(e) {
                // Set the background image of the container
                sceneContainer.style.backgroundImage = `url('${e.target.result}')`;
                
                // Hide the instruction overlay
                instructionOverlay.style.opacity = '0';
            };
            
            reader.readAsDataURL(file);
        }

        /**
         * Change the color of the 3D model's primary material.
         */
        function changeColor(element) {
            if (!viewer.model) {
                alert("Please wait for the 3D model to load.");
                return;
            }
            
            // Extract the RGB color array from the data attribute
            const colorString = element.getAttribute("data-color");
            const colorArray = colorString.split(',').map(Number);
            
            try {
                // Apply the color to the first material layer of the 3D object
                const material = viewer.model.materials[0];
                if (material) {
                    material.pbrMetallicRoughness.setBaseColorFactor(colorArray);
                }
            } catch (error) {
                console.error("Error changing color:", error);
            }
        }

        /**
         * Handle uploading a new .glb 3D model
         */
        function handleModelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (currentModelUrl) {
                URL.revokeObjectURL(currentModelUrl);
            }

            currentModelUrl = URL.createObjectURL(file);
            viewer.src = currentModelUrl;
            
            // Reset input
            event.target.value = '';
        }
    </script>
</body>
</html>
